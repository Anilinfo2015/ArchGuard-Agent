name: ArchGuard AI
description: Detect PR-scoped architecture drift between Structurizr and implementation evidence.
inputs:
  structurizr-json:
    description: Structurizr CLI JSON export path
    required: true
  dependency-cruiser-json:
    description: Optional dependency-cruiser JSON report
    required: false
  terraform-plan-json:
    description: Optional terraform show -json output
    required: false
  rules:
    description: Optional compiled rule artifact, or a directory of them
    required: false
  changed-files:
    description: Newline-separated paths changed by this pull request
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - shell: bash
      env:
        STRUCTURIZR_JSON: ${{ inputs.structurizr-json }}
        DEPENDENCY_CRUISER_JSON: ${{ inputs.dependency-cruiser-json }}
        TERRAFORM_PLAN_JSON: ${{ inputs.terraform-plan-json }}
        RULES: ${{ inputs.rules }}
        CHANGED_FILES: ${{ inputs.changed-files }}
      run: |
        args=(--structurizr "$STRUCTURIZR_JSON")
        if [ -n "$DEPENDENCY_CRUISER_JSON" ]; then args+=(--dependency-cruiser "$DEPENDENCY_CRUISER_JSON"); fi
        if [ -n "$TERRAFORM_PLAN_JSON" ]; then args+=(--terraform-plan "$TERRAFORM_PLAN_JSON"); fi
        if [ -n "$RULES" ]; then args+=(--rules "$RULES"); fi
        while IFS= read -r file; do
          if [ -n "$file" ]; then args+=(--changed-file "$file"); fi
        done <<< "$CHANGED_FILES"
        python -m archguard.cli "${args[@]}"
